<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RV Digital — Protótipo de Agente de IA</title>
<style>
  :root{
    --azul:#030096;
    --laranja:#ffaa00;
    --bg:#f0f2f5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding:24px 12px;
  }
  header{
    max-width:520px;
    width:100%;
    text-align:center;
    margin-bottom:16px;
  }
  header h1{
    color:var(--azul);
    font-size:20px;
    margin:0 0 4px 0;
  }
  header p{
    color:#555;
    font-size:13px;
    margin:0;
  }
  .badge{
    display:inline-block;
    background:var(--laranja);
    color:#1a1a1a;
    font-size:11px;
    font-weight:700;
    padding:3px 10px;
    border-radius:999px;
    margin-bottom:8px;
    letter-spacing:.3px;
  }
  .chatbox{
    width:100%;
    max-width:520px;
    background:#fff;
    border-radius:16px;
    box-shadow:0 4px 24px rgba(3,0,150,0.12);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    height:70vh;
  }
  .chat-header{
    background:var(--azul);
    color:#fff;
    padding:14px 18px;
    font-weight:600;
    font-size:15px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .chat-header .dot{
    width:9px;height:9px;border-radius:50%;background:#4ade80;
  }
  .messages{
    flex:1;
    overflow-y:auto;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
    background:#e9ebee;
  }
  .msg{
    max-width:78%;
    padding:9px 13px;
    border-radius:14px;
    font-size:14.5px;
    line-height:1.4;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .msg.bot{
    align-self:flex-start;
    background:#fff;
    color:#1a1a1a;
    border-bottom-left-radius:4px;
  }
  .msg.user{
    align-self:flex-end;
    background:var(--azul);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .msg.typing{
    align-self:flex-start;
    background:#fff;
    color:#999;
    font-style:italic;
  }
  .inputbar{
    display:flex;
    padding:12px;
    gap:8px;
    border-top:1px solid #ddd;
    background:#fff;
  }
  .inputbar input{
    flex:1;
    border:1px solid #ccc;
    border-radius:20px;
    padding:10px 16px;
    font-size:14px;
    outline:none;
  }
  .inputbar input:focus{
    border-color:var(--azul);
  }
  .inputbar button{
    background:var(--azul);
    color:#fff;
    border:none;
    border-radius:20px;
    padding:0 20px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .inputbar button:disabled{
    opacity:.5;
    cursor:not-allowed;
  }
  footer{
    margin-top:14px;
    font-size:11px;
    color:#888;
    text-align:center;
    max-width:520px;
  }
</style>
</head>
<body>

<header>
  <div class="badge">PROTÓTIPO DE DEMONSTRAÇÃO</div>
  <h1>RV Digital — Agente de IA</h1>
  <p>Converse como se fosse um lead real. Este é um protótipo funcional, não um mockup.</p>
</header>

<div class="chatbox">
  <div class="chat-header">
    <div class="dot"></div>
    Rafaela — RV Digital Energia Solar
  </div>
  <div class="messages" id="messages"></div>
  <div class="inputbar">
    <input type="text" id="inputText" placeholder="Digite sua mensagem..." autocomplete="off">
    <button id="sendBtn">Enviar</button>
  </div>
</div>

<footer>
  Protótipo interno RV Digital — respostas geradas por IA em tempo real. Não é um fluxo real de produção.
</footer>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('inputText');
  const sendBtn = document.getElementById('sendBtn');

  let history = [];

  function addBubble(text, who){
    const div = document.createElement('div');
    div.className = 'msg ' + who;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function addTyping(){
    const div = document.createElement('div');
    div.className = 'msg typing';
    div.textContent = 'digitando...';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  async function send(){
    const text = inputEl.value.trim();
    if(!text) return;
    inputEl.value = '';
    sendBtn.disabled = true;
    addBubble(text, 'user');
    history.push({ role: 'user', content: text });

    const typingEl = addTyping();

    try{
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });
      const data = await resp.json();
      typingEl.remove();
      if(!resp.ok){
        addBubble('Erro: ' + (data.error || 'falha desconhecida'), 'bot');
        return;
      }
      addBubble(data.reply, 'bot');
      history.push({ role: 'assistant', content: data.reply });
    }catch(err){
      typingEl.remove();
      addBubble('Erro de conexão. Tente novamente.', 'bot');
    }finally{
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') send();
  });

  addBubble('Olá, tudo bem? 😊 Vi que você chegou por aqui pelos nossos anúncios. Como eu posso te ajudar com energia solar? E como posso te chamar? Ah, e eu sou a Rafaela, assistente virtual da RV Digital!', 'bot');
</script>

</body>
</html>
